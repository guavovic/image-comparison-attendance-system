name: Release

on:
  push:
    tags: ["v*"]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/release.yml"
      - "pom.xml"

permissions:
  contents: read

jobs:
  jar:
    name: Empacotar o .jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Definir a versão
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "VERSION=0.0.0-ci" >> "$GITHUB_ENV"
          fi

      - name: Compilar, testar e empacotar
        run: ./mvnw --batch-mode --no-transfer-progress -Drevision="$VERSION" verify

      - name: Conferir o .jar
        run: |
          unzip -p target/ponto-facial.jar META-INF/MANIFEST.MF | grep "Main-Class: io.github.guavovic.pontofacial.App"
          unzip -l target/ponto-facial.jar | grep "nu/pattern/opencv/windows/x86_64/opencv_java490.dll"
          cp target/ponto-facial.jar "ponto-facial-$VERSION.jar"

      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: ponto-facial-*.jar

  release:
    name: Publicar a release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: jar
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: jar
          path: dist

      - name: Criar a release com o .jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar --repo "$GITHUB_REPOSITORY" --title "Ponto Facial ${GITHUB_REF_NAME#v}" --generate-notes --notes "Precisa do Java 25 para abrir (\`java -jar ponto-facial-${GITHUB_REF_NAME#v}.jar\`). A câmera funciona só no Windows."
